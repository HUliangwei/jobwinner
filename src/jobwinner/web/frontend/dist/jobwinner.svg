<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="jwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#F04F00"/>
    </linearGradient>
  </defs>
  <!-- 深色圆角底 -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#0F172A"/>
  <!-- 粗准星环（大而醒目） -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#jwGrad)" stroke-width="7"/>
  <!-- 中心实心靶心 -->
  <circle cx="32" cy="32" r="10" fill="url(#jwGrad)"/>
  <!-- 白色 JW 箭头（主动出击 + 推进） -->
  <path d="M32 25 L32 39 M27.5 30.5 L32 35.5 L36.5 30.5" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 四个准星刻度（外延到边） -->
  <line x1="32" y1="0" x2="32" y2="10" stroke="#FB6511" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="64" stroke="#FB6511" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="0" y1="32" x2="10" y2="32" stroke="#FB6511" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="64" y2="32" stroke="#FB6511" stroke-width="3.5" stroke-linecap="round"/>
</svg>