[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobwinner"
version = "2.4.0"
description = "JobWinner 智能求职Agent - 端到端自动化求职工具"
requires-python = ">=3.10"
license = "LicenseRef-JobWinner-NonCommercial"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "patchright>=1.58.2",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "markdown2>=2.4",
    "bottle>=0.13",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
pdf = [
    "xhtml2pdf>=0.2.11",
]

[project.scripts]
jobwinner = "jobwinner.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwinner"]
artifacts = [
    "src/jobwinner/browser/runtime/*.mjs",
    "src/jobwinner/browser/runtime/site-patterns/*.md",
    "src/jobwinner/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
